  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: white;
      background: linear-gradient(135deg, #0b1020, #1a1f3a, #0f1629);
      background-size: 400% 400%;
      animation: bgMove 15s ease infinite;
    }

    @keyframes bgMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      animation: float 10s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 0; }
      10%, 90% { opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    .video-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
      animation: fadeDown .8s ease-out;
    }

    .header h1 {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 0 30px rgba(80,180,255,.4);
    }

    .header p {
      color: rgba(255,255,255,.65);
      font-size: 15px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,.5),
                  0 0 0 1px rgba(255,255,255,.1) inset;
      animation: fadeUp .8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .play-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,.17);
      backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 3;
      transition: .25s;
    }

    .play-overlay::after {
      content: "▶";
      font-size: 30px;
      margin-left: 4px;
    }

    .play-overlay:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(255,255,255,.27);
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.7);
    }

    /* Kontrol video */
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 4;
      padding: 38px 14px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.92));
      opacity: 1;
      transition: opacity .25s;
    }

    .video-wrapper.playing:not(:hover):not(:focus-within) .video-controls {
      opacity: 0;
    }

    .video-wrapper.playing:not(:hover):not(:focus-within) {
      cursor: none;
    }

    .timeline {
      width: 100%;
      height: 5px;
      display: block;
      margin-bottom: 12px;
      accent-color: #36a3ff;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      border: 0;
      color: white;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      padding: 5px;
      white-space: nowrap;
    }

    .control-btn:hover {
      color: #55c0ff;
    }

    .time-display {
      font-size: 12px;
      color: #fff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .controls-spacer {
      flex: 1;
    }

    .speed-select {
      max-width: 75px;
      padding: 5px;
      color: white;
      background: rgba(30,30,30,.9);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 6px;
      font-size: 12px;
    }

    .speed-select option {
      color: white;
      background: #171717;
    }

    .info-bar {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .info-tag {
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      font-size: 13px;
    }

    .action-buttons {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 12px 18px;
      border: 0;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, #238cff, #0878ee);
      color: white;
    }

    .btn-secondary {
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
    }

    .btn-download {
      color: white;
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .ad-banner-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(0,0,0,.9);
      border-top: 1px solid rgba(255,255,255,.1);
      z-index: 20;
    }

    @media (max-width: 480px) {
      body { padding: 18px 10px 80px; }
      .header { margin-bottom: 16px; }
      .header h1 { font-size: 24px; }
      .video-wrapper { border-radius: 12px; }
      .play-overlay { width: 64px; height: 64px; }
      .controls-row { gap: 5px; }
      .control-btn { font-size: 15px; padding: 4px; }
      .time-display { font-size: 10px; }
      .speed-select { max-width: 65px; font-size: 11px; }
      .btn { padding: 10px 14px; font-size: 12px; }
      .info-tag { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>

<body>
  <div class="particles" id="particles"></div>

  <!-- Tempat iklan yang kamu kirim -->
  <div id="container-d4d647d760fe055702fad1911bf39c35"></div>

  <main class="video-container">
    <header class="header">
      <h1>🎬 Video Premium</h1>
      <p>Tonton selengkapnya</p>
    </header>

    <div class="video-wrapper" id="videoWrapper">
      <video id="myVideo" playsinline webkit-playsinline preload="metadata">
        <source src="furinacostplay.mp4" type="video/mp4">
        Browser kamu tidak mendukung pemutar video.
      </video>

      <button class="play-overlay" id="playBtn"
        type="button" aria-label="Putar video"></button>

      <div class="video-controls">
        <input class="timeline" id="timeline" type="range"
          min="0" max="1000" value="0" step="1"
          aria-label="Posisi video">

        <div class="controls-row">
          <button class="control-btn" id="playPauseBtn"
            type="button" aria-label="Putar atau jeda">▶</button>

          <button class="control-btn" id="backBtn"
            type="button" aria-label="Mundur 10 detik">↶10</button>

          <button class="control-btn" id="forwardBtn"
            type="button" aria-label="Maju 10 detik">↷10</button>

          <span class="time-display" id="currentTime">0:00</span>
          <span class="time-display">/</span>
          <span class="time-display" id="duration">0:00</span>

          <span class="controls-spacer"></span>

          <select class="speed-select" id="speedSelect"
            aria-label="Kecepatan video">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>

          <button class="control-btn" id="fullscreenBtn"
            type="button" aria-label="Layar penuh">⛶</button>
        </div>
      </div>
    </div>

    <div class="info-bar">
      <span class="info-tag" id="durationTag">⏱ Durasi: memuat...</span>
      <span class="info-tag">📱 Video HD</span>
      <span class="info-tag">🎬 Pemutar video</span>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="watchBtn" type="button">
        ▶ Tonton
      </button>
      <button class="btn btn-secondary" id="fullscreenAction" type="button">
        ⛶ Layar Penuh
      </button>
      <a class="btn btn-download" href="furinacostplay.mp4" download>
        📥 Unduh Video
      </a>
    </div>
  </main>

  <!-- Banner iklan bawah -->
  <div class="ad-banner-bottom">
    <script>
      var atOptions = {

  <script>
    const particlesContainer = document.getElementById('particles');
    const video = document.getElementById('myVideo');
    const wrapper = document.getElementById('videoWrapper');
    const playBtn = document.getElementById('playBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const timeline = document.getElementById('timeline');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const durationTag = document.getElementById('durationTag');
    const speedSelect = document.getElementById('speedSelect');

    for (let i = 0; i < 35; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (6 + Math.random() * 8) + 's';
      particlesContainer.appendChild(particle);
    }

    function formatWaktu(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      seconds = Math.floor(seconds);
      const jam = Math.floor(seconds / 3600);
      const menit = Math.floor((seconds % 3600) / 60);
      const detik = seconds % 60;

      if (jam > 0) {
        return `${jam}:${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
      }
      return `${menit}:${String(detik).padStart(2, '0')}`;
    }

    async function putarVideo() {
      if (video.paused) {
        try {
          await video.play();
        } catch (error) {
          console.warn('Video tidak bisa diputar:', error);
        }
      } else {
        video.pause();
      }
    }

    function layarPenuh() {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
        return;
      }

      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      } else {
        alert('Layar penuh tidak didukung browser ini.');
      }
    }

    function perbaruiDurasi() {
      if (Number.isFinite(video.duration)) {
        durationEl.textContent = formatWaktu(video.duration);
        durationTag.textContent = '⏱ Durasi: ' + formatWaktu(video.duration);
      } else {
        durationEl.textContent = '0:00';
      }
    }

    function perbaruiTimeline() {
      currentTimeEl.textContent = formatWaktu(video.currentTime);

      if (Number.isFinite(video.duration) && video.duration > 0) {
        timeline.value = Math.round((video.currentTime / video.duration) * 1000);
      }
    }

    playBtn.addEventListener('click', putarVideo);
    playPauseBtn.addEventListener('click', putarVideo);
    document.getElementById('watchBtn').addEventListener('click', putarVideo);
    document.getElementById('fullscreenBtn').addEventListener('click', layarPenuh);
    document.getElementById('fullscreenAction').addEventListener('click', layarPenuh);

    document.getElementById('backBtn').addEventListener('click', () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });

    document.getElementById('forwardBtn').addEventListener('click', () => {
      if (Number.isFinite(video.duration)) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
      } else {
        video.currentTime += 10;
      }
    });

    timeline.addEventListener('input', () => {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        video.currentTime = (Number(timeline.value) / 1000) * video.duration;
      }
    });

    speedSelect.addEventListener('change', () => {
      video.playbackRate = Number(speedSelect.value);
    });

    video.addEventListener('loadedmetadata', perbaruiDurasi);
    video.addEventListener('durationchange', perbaruiDurasi);
    video.addEventListener('timeupdate', perbaruiTimeline);

    video.addEventListener('play', () => {
      playBtn.classList.add('hidden');
      wrapper.classList.add('playing');
      playPauseBtn.textContent = '⏸';
    });

    video.addEventListener('pause', () => {
      playBtn.classList.remove('hidden');
      wrapper.classList.remove('playing');
      playPauseBtn.textContent = '▶';
    });

    video.addEventListener('ended', () => {
      playBtn.classList.remove('hidden');
      wrapper.classList.remove('playing');
      playPauseBtn.textContent = '▶';
      timeline.value = 1000;
    });

    video.addEventListener('click', putarVideo);

    video.addEventListener('error', () => {
      durationTag.textContent = '⚠ Video gagal dimuat';
    });
  </script>
</body>
