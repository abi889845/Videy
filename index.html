<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Verifikasi</title>

<script data-cfasync="false"

<script data-cfasync="false"

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    display: block;
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 24px 14px;
    background: #f8f9fa;
    color: #202124;
}

.card {
    display: block;
    width: 100%;
    max-width: 400px;
    min-width: 0;
    margin: 24px auto;
    padding: 28px 22px 22px;
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    text-align: center;
}

.icon-wrap {
    width: 60px;
    height: 60px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #e8f0fe;
    color: #1a73e8;
}

.icon-wrap svg {
    width: 32px;
    height: 32px;
}

h1 {
    margin: 0 0 10px;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 600;
}

.description {
    margin: 0 0 22px;
    color: #5f6368;
    font-size: 14px;
    line-height: 1.6;
}

button {
    width: 100%;
    min-height: 50px;
    padding: 13px 12px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.btn-verifikasi {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: #1a73e8;
    color: #fff;
    cursor: pointer;
    transition: background .2s;
}

.btn-verifikasi:hover:not(:disabled) {
    background: #1765cc;
}

.btn-verifikasi svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}

.btn-verifikasi:disabled {
    cursor: default;
    opacity: .9;
}

.success {
    display: none;
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    background: #e6f4ea;
    color: #137333;
    font-size: 14px;
    line-height: 1.5;
}

.card.verified .success {
    display: block;
}

.card.verified .icon-wrap {
    background: #e6f4ea;
    color: #188038;
}

.card.verified .btn-verifikasi {
    background: #188038;
}

.ad-label {
    margin: 24px 0 10px;
    color: #80868b;
    font-size: 10px;
    letter-spacing: 1.2px;
}

.ad-slot {
    display: block;
    position: relative;
    width: 100%;
    min-width: 0;
    min-height: 50px;
    margin: 0 auto;
    text-align: center;
    overflow: hidden;
    background: #fff;
    isolation: isolate;
}

.ad-slot iframe {
    display: block;
    max-width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
}

/* Loading verifikasi */
.loading {
    display: none;
    margin-top: 16px;
    padding: 17px 12px;
    background: #f8f9fa;
    border: 1px solid #e8eaed;
    border-radius: 10px;
}

.loading.active {
    display: block;
}

.spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
    border: 3px solid #d2e3fc;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

.loading-text {
    color: #202124;
    font-size: 14px;
    font-weight: 600;
}

.loading-subtext {
    margin-top: 6px;
    color: #5f6368;
    font-size: 12px;
    line-height: 1.5;
}

.progress-track {
    width: 100%;
    height: 4px;
    margin-top: 14px;
    overflow: hidden;
    border-radius: 10px;
    background: #e8eaed;
}

.progress-bar {
    width: 0;
    height: 100%;
    background: #1a73e8;
}

.progress-bar.animate {
    width: 100%;
    transition: width 4s linear;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.btn-lanjut {
    margin-top: 20px;
    background: #e8eaed;
    color: #80868b;
    cursor: not-allowed;
}

.btn-lanjut:disabled {
    opacity: 1;
}

.card.verified .btn-lanjut {
    background: #1a73e8;
    color: #fff;
    cursor: pointer;
}

.card.verified .btn-lanjut:hover {
    background: #1765cc;
}

.hint {
    margin: 14px 0 0;
    color: #80868b;
    font-size: 12px;
    line-height: 1.6;
}

button:focus-visible {
    outline: 3px solid #aecbfa;
    outline-offset: 3px;
}

@media (max-width: 360px) {
    body {
        padding: 12px 8px;
    }

    .card {
        margin: 12px auto;
        padding: 24px 16px 20px;
    }

    h1 {
        font-size: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .spinner {
        animation-duration: 1.6s;
    }
}
</style>
</head>

<body>

<main class="card" id="verificationCard">

    <div class="icon-wrap" id="iconWrap">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
            <path d="m9 12 2 2 4-4"/>
        </svg>
    </div>

    <h1 id="heading">Satu langkah lagi!</h1>

    <p class="description" id="description">
        Klik tombol di bawah untuk melanjutkan ke konten
        yang kamu cari. Prosesnya cepat dan mudah.
    </p>

    <button class="btn-verifikasi" id="btnVerifikasi"
            type="button" onclick="verifikasi()">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <path d="m5 12 4 4L19 6"/>
        </svg>
        <span id="verificationText">Lanjutkan Verifikasi</span>
    </button>

    <!-- Panel loading -->
    <div class="loading" id="loadingBox"
         role="status" aria-live="polite">

        <div class="spinner"></div>

        <div class="loading-text" id="loadingText">
            Memproses verifikasi...
        </div>

        <div class="loading-subtext" id="loadingSubtext">
            Mohon tunggu sebentar.
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Pesan berhasil -->
    <div class="success" id="successMessage" role="status">
        ✓ Verifikasi berhasil! Silakan lanjutkan.
    </div>

    <p class="ad-label">ADVERTISEMENT</p>

    <!-- Wadah iklan -->
    <div class="ad-slot"
         id="container-d4d647d760fe055702fad1911bf39c35"></div>

    <!-- Banner iklan 320x50 -->
    <div class="ad-slot" id="banner-ad">
        <script>
            var atOptions = {
                key: '958e87a6c812dee324d395a6b5845e50',
                format: 'iframe',
                height: 50,
                width: 320,
                params: {}
            };
        </script>
        <script
            src="https://bancadeltempoidea.org/22/958e87a6c812dee324d395a6b5845e50">
        </script>
    </div>

    <button class="btn-lanjut" id="btnLanjut"
            type="button" disabled onclick="lanjutkan()">
        Lanjutkan →
    </button>

    <p class="hint">
        Cukup satu klik untuk melanjutkan ke halaman berikutnya.
    </p>

</main>

<script>
const card = document.getElementById('verificationCard');
const btnVerifikasi = document.getElementById('btnVerifikasi');
const verificationText = document.getElementById('verificationText');
const btnLanjut = document.getElementById('btnLanjut');
const heading = document.getElementById('heading');
const description = document.getElementById('description');

const loadingBox = document.getElementById('loadingBox');
const loadingText = document.getElementById('loadingText');
const loadingSubtext = document.getElementById('loadingSubtext');
const progressBar = document.getElementById('progressBar');

let verified = false;
let processing = false;

function verifikasi() {
    if (verified || processing) return;

    processing = true;

    btnVerifikasi.disabled = true;
    btnLanjut.disabled = true;

    verificationText.textContent = 'Sedang Memverifikasi...';
    heading.textContent = 'Memeriksa permintaan';
    description.textContent =
        'Mohon tunggu sebentar sampai proses selesai.';

    loadingBox.classList.add('active');
    loadingText.textContent = 'Memproses verifikasi...';
    loadingSubtext.textContent = 'Mohon tunggu sebentar.';
    progressBar.classList.remove('animate');
    progressBar.style.width = '0%';

    // Memulai animasi setelah browser menggambar panel loading.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            progressBar.classList.add('animate');
        });
    });

    // Simulasi proses selama 4 detik.
    // Ini bukan pemeriksaan keamanan sungguhan.
    setTimeout(() => {
        verified = true;
        processing = false;

        card.classList.add('verified');

        loadingBox.classList.remove('active');
        progressBar.classList.remove('animate');

        heading.textContent = 'Verifikasi berhasil!';
        description.textContent =
            'Selesai! Sekarang kamu bisa melanjutkan ke konten.';

        verificationText.textContent = 'Terverifikasi ✓';

        btnVerifikasi.disabled = true;
        btnLanjut.disabled = false;
    }, 4000);
}

function lanjutkan() {
    if (!verified || processing) return;

    window.location.href = 'Pilihvid.html';
}
</script>

</body>
</html>
