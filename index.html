    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #f0f1f3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 24px 26px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 56px;
            background: #eaebee;
            border-radius: 28px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .slider-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            border-radius: 28px;
            transition: none;
        }

        .slider-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #9ca3af;
            pointer-events: none;
            white-space: nowrap;
        }

        .slider-handle {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 50px;
            height: 50px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            z-index: 2;
            transition: background 0.2s;
        }

        .slider-handle:active {
            cursor: grabbing;
        }

        .slider-handle svg {
            width: 22px;
            height: 22px;
            fill: white;
            transition: transform 0.2s, opacity 0.2s;
        }

        .card.verified .slider-container {
            background: transparent;
        }

        .card.verified .slider-fill {
            width: 100%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
        }

        .card.verified .slider-text {
            display: none;
        }

        .card.verified .slider-handle {
            left: calc(100% - 53px);
            background: #22c55e;
        }

        .card.verified .slider-handle svg {
            transform: rotate(90deg);
            opacity: 0;
        }

        .card.verified .slider-handle::after {
            content: "✓";
            font-size: 24px;
            color: white;
            font-weight: bold;
        }

        .success-message {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .card.verified .success-message {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .success-icon {
            font-size: 42px;
            color: #22c55e;
            margin-bottom: 6px;
        }

        .success-text {
            font-size: 22px;
            font-weight: bold;
            color: #22c55e;
        }

        .btn-lanjut {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #d1d5db;
            color: #9ca3af;
            font-size: 18px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .card.verified .btn-lanjut {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .card.verified .btn-lanjut:hover {
            background: #1d4ed8;
        }

        .btn-lanjut:active {
            transform: scale(0.98);
        }

        .hint-text {
            text-align: center;
            font-size: 14px;
            color: #9ca3af;

        /* Iklan Banner 320x50 di bawah */

<body>

    <div class="card" id="verificationCard">

        <div class="success-message">
            <div class="success-icon">✓</div>
            <div class="success-text">Verification successful!</div>
        </div>

        <div class="slider-container" id="sliderContainer">
            <div class="slider-fill" id="sliderFill"></div>
            <div class="slider-text" id="sliderText">Geser untuk verifikasi</div>
            <div class="slider-handle" id="sliderHandle">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </div>
        </div>

        <button class="btn-lanjut" id="btnLanjut" onclick="lanjutkan()">
            Lanjutkan →
        </button>

        <p class="hint-text">Langkah ini diperlukan untuk mencegah akses otomatis</p>

    </div>

    <!-- Iklan Banner 320x50 di bawah -->
    <div class="ad-container">

          atOptions = {

<script>
    const card = document.getElementById('verificationCard');
    const container = document.getElementById('sliderContainer');
    const fill = document.getElementById('sliderFill');
    const handle = document.getElementById('sliderHandle');
    const btnLanjut = document.getElementById('btnLanjut');

    let isDragging = false;
    let verified = false;

    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag);
    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) {
        if (verified) return;
        isDragging = true;
    }

    function drag(e) {
        if (!isDragging || verified) return;
        e.preventDefault();

        const rect = container.getBoundingClientRect();
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        
        let posX = clientX - rect.left - 25;
        const maxX = rect.width - 56;

        if (posX < 3) posX = 3;
        if (posX > maxX) posX = maxX;

        const percent = (posX / maxX) * 100;
        fill.style.width = percent + '%';
        handle.style.left = posX + 'px';

        if (posX >= maxX - 5) {
            success();
        }
    }

    function endDrag() {
        if (verified) return;
        isDragging = false;

        const rect = container.getBoundingClientRect();
        const maxX = rect.width - 56;
        const currentPos = parseFloat(handle.style.left) || 0;

        if (currentPos < maxX - 10) {
            fill.style.width = '0%';
            handle.style.left = '3px';
        }
    }

    function success() {
        verified = true;
        isDragging = false;
        card.classList.add('verified');
    }

    function lanjutkan() {
        if (!verified) return;
        window.location.href = 'Pilihvid.html';
    }
</script>
