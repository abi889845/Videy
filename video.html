<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(135deg,#0b1020,#1a1f3a,#0f1629);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 16px 80px;
}

@keyframes bgMove {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255,255,255,.3);
    border-radius: 50%;
    animation: float 10s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    10%,90% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.video-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 24px;
    animation: fadeDown .8s ease-out;
}

.header h1 {
    font-size: clamp(24px,5vw,42px);
    color: white;
    font-weight: 800;
    text-shadow: 0 0 30px rgba(80,180,255,.4);
    margin-bottom: 6px;
}

.header p {
    color: rgba(255,255,255,.65);
    font-size: 15px;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 50px rgba(0,0,0,.5),
                0 0 80px rgba(80,160,255,.1);
    animation: fadeUp .8s ease-out;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
}

.play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 76px;
    height: 76px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    cursor: pointer;
    z-index: 2;
    transition: .2s;
}

.play-overlay::after {
    content: "▶";
    font-size: 30px;
    color: white;
    margin-left: 4px;
}

.play-overlay.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%,-50%) scale(.7);
}

.video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 38px 12px 12px;
    color: white;
    background: linear-gradient(transparent,rgba(0,0,0,.92));
}

.progress-bar {
    display: block;
    width: 100%;
    height: 5px;
    margin-bottom: 12px;
    cursor: pointer;
    accent-color: #ff3030;
    touch-action: pan-y;
}

.controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.controls-row button {
    color: white;
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
}

.controls-row button:hover {
    color: #69b7ff;
}

.video-time {
    flex: 1;
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.speed-select {
    color: white;
    background: #202020;
    border: 1px solid #777;
    border-radius: 5px;
    padding: 5px;
    font-size: 12px;
}

.speed-select option {
    background: #202020;
    color: white;
}

.info-bar {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.info-tag {
    padding: 8px 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50px;
    color: rgba(255,255,255,.85);
    font-size: 13px;
}

.action-buttons {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.btn-primary {
    background: linear-gradient(135deg,#238cff,#0878ee);
    color: white;
}

.btn-secondary {
    background: rgba(255,255,255,.08);
    color: white;
    border: 1px solid rgba(255,255,255,.18);
}

.btn-download {
    background: linear-gradient(135deg,#22c55e,#16a34a);
    color: white;
}

.ad-banner-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    min-height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.85);
    border-top: 1px solid rgba(255,255,255,.1);
    z-index: 999;
}

@media(max-width:480px) {
    body { padding: 12px 10px 70px; }
    .header { margin-bottom: 16px; }
    .header h1 { font-size: 22px; }
    .video-wrapper { border-radius: 12px; }
    .play-overlay { width: 60px; height: 60px; }
    .play-overlay::after { font-size: 25px; }
    .controls-row { gap: 5px; }
    .controls-row button { font-size: 16px; }
    .video-time { font-size: 10px; }
    .speed-select { padding: 4px 2px; font-size: 11px; }
    .video-controls { padding: 28px 8px 8px; }
    .btn { padding: 10px 13px; font-size: 12px; }
    .info-tag { font-size: 12px; padding: 6px 12px; }
}
</style>

<body>
<div class="particles" id="particles"></div>

<main class="video-container">
    <header class="header">
        <h1>🎬 Video Premium</h1>
        <p>Tonton selengkapnya</p>
    </header>

    <div class="video-wrapper" id="videoWrapper">
        <video id="myVideo" playsinline webkit-playsinline preload="metadata">
            <source src="video.mp4" type="video/mp4">
            Browser kamu tidak mendukung pemutar video.
        </video>

        <button class="play-overlay" id="playBtn"
                aria-label="Putar video" type="button"></button>

        <div class="video-controls">
            <input type="range" id="progressBar"
                   class="progress-bar" min="0" max="1000"
                   value="0" step="1" aria-label="Posisi video">

            <div class="controls-row">
                <button type="button" id="back10" aria-label="Mundur 10 detik">↶10</button>
                <button type="button" id="togglePlay" aria-label="Putar">▶</button>
                <button type="button" id="forward10" aria-label="Maju 10 detik">10↷</button>

                <span class="video-time" id="videoTime">0:00 / 0:00</span>

                <select id="playbackSpeed" class="speed-select"
                        aria-label="Kecepatan video">
                    <option value="0.5">0.5×</option>
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.5×</option>
                    <option value="1.75">1.75×</option>
                    <option value="2">2×</option>
                </select>

                <button type="button" id="fullscreenBtn"
                        aria-label="Layar penuh">⛶</button>
            </div>
        </div>
    </div>

    <div class="info-bar">
        <span class="info-tag" id="durationTag">⏱ Durasi: memuat...</span>
        <span class="info-tag">📱 Full HD</span>
        <span class="info-tag">Biasa ajaa</span>
    </div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="watchBtn">▶ Tonton</button>
        <button class="btn btn-secondary" id="fullscreenAction">⛶ Layar Penuh</button>
        <a class="btn btn-download" href="video.mp4" download>📥 Unduh Video</a>
    </div>
</main>

<div class="ad-banner-bottom">

<script>
const particlesContainer = document.getElementById('particles');

for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    particlesContainer.appendChild(p);
}

const video = document.getElementById('myVideo');
const playBtn = document.getElementById('playBtn');
const togglePlay = document.getElementById('togglePlay');
const progressBar = document.getElementById('progressBar');
const videoTime = document.getElementById('videoTime');
const playbackSpeed = document.getElementById('playbackSpeed');
const durationTag = document.getElementById('durationTag');
const videoWrapper = document.getElementById('videoWrapper');

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';

    seconds = Math.floor(seconds);
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    if (hours > 0) {
        return hours + ':' +
            String(minutes).padStart(2, '0') + ':' +
            String(secs).padStart(2, '0');
    }

    return minutes + ':' + String(secs).padStart(2, '0');
}

function updateTime() {
    const current = video.currentTime || 0;
    const duration = video.duration;

    videoTime.textContent = formatTime(current) + ' / ' + formatTime(duration);

    if (Number.isFinite(duration) && duration > 0) {
        progressBar.value = Math.round((current / duration) * 1000);
        durationTag.textContent = '⏱ Durasi: ' + formatTime(duration);
    } else {
        durationTag.textContent = '⏱ Durasi: memuat...';
    }
}

function toggleVideo() {
    if (video.paused) {
        const result = video.play();
        if (result && result.catch) result.catch(() => {});
    } else {
        video.pause();
    }
}

function seek(seconds) {
    if (!Number.isFinite(video.duration)) return;
    video.currentTime = Math.max(
        0,
        Math.min(video.duration, video.currentTime + seconds)
    );
    updateTime();
}

function toggleFullscreen() {
    if (document.fullscreenElement) {
        document.exitFullscreen?.();
        return;
    }

    if (videoWrapper.requestFullscreen) {
        videoWrapper.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
    } else if (video.webkitRequestFullscreen) {
        videoWrapper.webkitRequestFullscreen();
    }
}

playBtn.addEventListener('click', toggleVideo);
togglePlay.addEventListener('click', toggleVideo);
document.getElementById('watchBtn').addEventListener('click', toggleVideo);

document.getElementById('back10').addEventListener('click', () => seek(-10));
document.getElementById('forward10').addEventListener('click', () => seek(10));

document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
document.getElementById('fullscreenAction').addEventListener('click', toggleFullscreen);

playbackSpeed.addEventListener('change', () => {
    video.playbackRate = Number(playbackSpeed.value);
});

progressBar.addEventListener('input', () => {
    if (Number.isFinite(video.duration) && video.duration > 0) {
        video.currentTime = (Number(progressBar.value) / 1000) * video.duration;
        updateTime();
    }
});

video.addEventListener('loadedmetadata', updateTime);
video.addEventListener('durationchange', updateTime);
video.addEventListener('timeupdate', updateTime);

video.addEventListener('play', () => {
    playBtn.classList.add('hidden');
    togglePlay.textContent = '⏸';
    togglePlay.setAttribute('aria-label', 'Jeda video');
});

video.addEventListener('pause', () => {
    playBtn.classList.remove('hidden');
    togglePlay.textContent = '▶';
    togglePlay.setAttribute('aria-label', 'Putar video');
});

video.addEventListener('ended', () => {
    playBtn.classList.remove('hidden');
    updateTime();
});

video.addEventListener('error', () => {
    durationTag.textContent = '⚠ Video gagal dimuat';
});

updateTime();
</script>
